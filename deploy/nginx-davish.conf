# Davish's House. Served on the bare IP over HTTP until a domain is pointed here;
# then add the domain to server_name, run certbot, and switch DAVISH_BASE_URL to https.
limit_req_zone $binary_remote_addr zone=davish_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=davish_all:10m rate=20r/s;

upstream davish_app { server 127.0.0.1:8100; keepalive 16; }

server {
    listen 80;
    listen [::]:80;
    server_name davishshouse.com www.davishshouse.com 208.87.242.141;

    client_max_body_size 120m;   # up to 20 photos per upload
    gzip on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json text/plain;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location /static/ {
        proxy_pass http://davish_app;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # Uploaded photos are served straight from disk.
    location /uploads/ {
        alias /var/lib/davish/uploads/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Brute-force protection on credential endpoints.
    location ~ ^/(login|signup|forgot|reset/) {
        limit_req zone=davish_auth burst=10 nodelay;
        proxy_pass http://davish_app;
        include /etc/nginx/snippets/davish-proxy.conf;
    }

    location / {
        limit_req zone=davish_all burst=40 nodelay;
        add_header Cache-Control "no-store" always;
        proxy_pass http://davish_app;
        include /etc/nginx/snippets/davish-proxy.conf;
    }
}
