{% extends "base.html" %}
{% block title %}{{ _('Choose a new password') }}{% endblock %}
{% block content %}
<div class="auth">
  <h1>{{ _('Choose a new password') }}</h1>
  {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
  <form method="post" action="/reset/{{ token }}">
    <label class="field"><span>{{ _('New password') }}</span><input type="password" name="password" minlength="8" required autofocus></label>
    <label class="field"><span>{{ _('Confirm password') }}</span><input type="password" name="confirm" minlength="8" required></label>
    <button class="btn btn-block">{{ _('Save password') }}</button>
  </form>
</div>
{% endblock %}
